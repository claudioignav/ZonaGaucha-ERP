<button
  type="button"
  class="fixed left-4 top-4 z-40 flex size-11 items-center justify-center rounded-lg bg-[#1e3f20] text-white shadow-lg transition hover:bg-[#28552b] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#52b788] md:hidden"
  aria-label="Abrir menú de navegación"
  [attr.aria-expanded]="menuMovilAbierto"
  aria-controls="menu-principal"
  (click)="alternarMenuMovil()"
>
  <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
  </svg>
</button>

<button
  *ngIf="menuMovilAbierto"
  type="button"
  class="fixed inset-0 z-40 bg-black/50 md:hidden"
  aria-label="Cerrar menú de navegación"
  (click)="cerrarMenuMovil()"
></button>

<div class="hidden w-60 shrink-0 md:block" aria-hidden="true"></div>

<aside
  id="menu-principal"
  class="fixed inset-y-0 left-0 z-50 box-border flex h-dvh w-60 flex-col overflow-hidden bg-[#1e3f20] px-4 py-3 text-[#d8f3dc] shadow-xl transition-transform duration-300 md:translate-x-0 md:shadow-none"
  [class.-translate-x-full]="!menuMovilAbierto"
  [class.translate-x-0]="menuMovilAbierto"
  aria-label="Navegación principal"
>
  <div class="flex items-center gap-3">
    <img class="size-10 shrink-0 object-contain" src="assets/icons/logo.svg" alt="Logo de ZonaGaucha" />

    <div class="min-w-0 flex-1">
      <p class="truncate [font-family:'Gabarito-ExtraBold',sans-serif] text-xl font-extrabold tracking-[-0.5px] text-white">
        ZonaGaucha
      </p>
      <p class="[font-family:'Geist-Medium',sans-serif] text-[11px] font-medium tracking-[0.5px] text-[#52b788]">
        SISTEMA ERP
      </p>
    </div>

    <button
      type="button"
      class="flex size-8 items-center justify-center rounded-md text-white/80 hover:bg-white/10 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#52b788] md:hidden"
      aria-label="Cerrar menú"
      (click)="cerrarMenuMovil()"
    >
      <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path stroke-linecap="round" d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>
  </div>

  <nav class="mt-4 flex min-h-0 flex-1 flex-col" aria-label="Opciones del sistema">
    <ul class="space-y-1">
      <li *ngFor="let elemento of elementosPrincipales">
        <button
          type="button"
          class="flex w-full items-center gap-3 rounded-lg px-4 py-2 text-left [font-family:'Geist-Medium',sans-serif] text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#52b788]"
          [ngClass]="elementoActivo === elemento.id ? 'bg-[#377c39] text-white' : 'hover:bg-white/10'"
          [attr.aria-current]="elementoActivo === elemento.id ? 'page' : null"
          (click)="seleccionarElemento(elemento)"
        >
          <img class="size-[18px] shrink-0" [src]="elemento.icono" alt="" aria-hidden="true" />
          <span>{{ elemento.nombre }}</span>
        </button>
      </li>
    </ul>

    <section
      *ngFor="let seccion of secciones; let primera = first"
      [ngClass]="primera ? 'mt-3' : 'mt-5'"
    >
      <button
        type="button"
        class="flex w-full items-center justify-between rounded-lg px-4 py-1.5 text-left [font-family:'Geist-Bold',sans-serif] text-[11px] font-bold tracking-[0.5px] text-white transition-colors hover:bg-white/5 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#52b788]"
        [attr.aria-expanded]="seccion.expandida"
        [attr.aria-controls]="'seccion-' + seccion.id"
        (click)="alternarSeccion(seccion)"
      >
        <span>{{ seccion.titulo }}</span>
        <svg
          class="size-3 transition-transform"
          [class.rotate-180]="!seccion.expandida"
          viewBox="0 0 12 12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="m3 4.5 3 3 3-3" />
        </svg>
      </button>

      <ul *ngIf="seccion.expandida" class="mt-1 space-y-0.5" [id]="'seccion-' + seccion.id">
        <li *ngFor="let elemento of seccion.elementos">
          <button
            type="button"
            class="flex w-full items-center gap-3 rounded-lg px-4 py-2 text-left [font-family:'Geist-Medium',sans-serif] text-sm font-medium transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#52b788]"
            [ngClass]="elementoActivo === elemento.id ? 'bg-[#377c39] text-white' : 'hover:bg-white/10'"
            [attr.aria-current]="elementoActivo === elemento.id ? 'page' : null"
            (click)="seleccionarElemento(elemento)"
          >
            <img class="size-[18px] shrink-0" [src]="elemento.icono" alt="" aria-hidden="true" />
            <span class="leading-5">{{ elemento.nombre }}</span>
          </button>
        </li>
      </ul>
    </section>
  </nav>

  <div class="mt-2 shrink-0 border-t border-white/10 pt-2">
    <div class="flex items-center gap-3">
      <div class="flex size-9 shrink-0 items-center justify-center rounded-full bg-[#2d6a4f] [font-family:'Geist-SemiBold',sans-serif] text-sm font-semibold text-white">
        RN
      </div>

      <div class="min-w-0 flex-1">
        <p class="truncate [font-family:'Geist-SemiBold',sans-serif] text-[13px] font-semibold text-white">Raul Noguera</p>
        <p class="truncate [font-family:'Geist-Regular',sans-serif] text-[11px] text-[#d8f3dc]/70">Administrador</p>
      </div>

      <button
        type="button"
        class="flex size-7 shrink-0 items-center justify-center rounded-md bg-white/10 transition-colors hover:bg-white/20 focus-visible:outline focus-visible:outline-2 focus-visible:outline-[#52b788]"
        aria-label="Cerrar sesión"
      >
        <img class="size-4" src="assets/icons/log-out.svg" alt="" aria-hidden="true" />
      </button>
    </div>
  </div>
</aside>
