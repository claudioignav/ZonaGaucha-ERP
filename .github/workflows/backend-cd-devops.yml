name: backend-cd-devops

on:
  workflow_run:
    workflows: [backend-ci-devops]
    types: [completed]
    branches: ["test/e**"]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de una ejecución exitosa de backend-ci-devops en test/e*
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  AZURE_RESOURCE_GROUP: zg-erp
  AZURE_BACKEND_APP_NAME: zgerpbacktest
  AZURE_BACKEND_URL: https://zgerpbacktest.azurewebsites.net

concurrency:
  group: backend-cd-devops-testing
  cancel-in-progress: false

jobs:
  analisis-iac:
    name: Análisis de infraestructura (IaC)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ci_run_id: ${{ steps.validar-ci.outputs.ci_run_id }}
      head_sha: ${{ steps.validar-ci.outputs.head_sha }}
      directorio_terraform: ${{ steps.rutas-terraform.outputs.directorio }}

    steps:
      - name: Verificar origen y resultado del CI
        id: validar-ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORIO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CD_REF: ${{ github.ref }}
          EVENTO_CD: ${{ github.event_name }}
        run: |
          set -euo pipefail

          if [[ "$EVENTO_CD" == workflow_dispatch && ! "$CD_REF" =~ ^refs/heads/test/e ]]; then
            echo "::error::Ejecuta el CD manual desde una rama test/e*."
            exit 1
          fi

          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::El ID del CI debe ser numérico."
            exit 1
          fi

          workflow_id=$(gh api "repos/$REPOSITORIO/actions/workflows/backend-ci-devops.yml" --jq '.id')
          ejecucion=$(gh api "repos/$REPOSITORIO/actions/runs/$CI_RUN_ID")

          if ! jq -e --arg repositorio "$REPOSITORIO" --argjson workflow_id "$workflow_id" \
            --arg cd_ref "$CD_REF" --arg evento_cd "$EVENTO_CD" '
            .workflow_id == $workflow_id and
            .repository.full_name == $repositorio and
            .head_repository.full_name == $repositorio and
            (.head_branch | startswith("test/e")) and
            ($evento_cd != "workflow_dispatch" or ("refs/heads/" + .head_branch) == $cd_ref) and
            .status == "completed" and
            .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$ejecucion" > /dev/null; then
            echo "::error::Se requiere un backend-ci-devops exitoso de una rama test/e* de este repositorio."
            exit 1
          fi

          head_sha=$(jq -r '.head_sha' <<< "$ejecucion")
          printf 'ci_run_id=%s\n' "$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Descargar configuración Terraform del commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.validar-ci.outputs.head_sha }}
          persist-credentials: false

      - name: Localizar configuración Terraform del commit aprobado
        id: rutas-terraform
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d infra/environments/testing/backend ]]; then
            directorio=infra/environments/testing/backend
          elif [[ -d infra/backend/testing ]]; then
            directorio=infra/backend/testing
          else
            echo "::error::No se encontró la configuración Terraform de testing para backend."
            exit 1
          fi

          printf 'directorio=%s\n' "$directorio" >> "$GITHUB_OUTPUT"

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-dist-reducido
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.validar-ci.outputs.ci_run_id }}

      - name: Analizar Terraform con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: config
          scan-ref: ${{ steps.rutas-terraform.outputs.directorio }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  despliegue-testing:
    name: Despliegue del backend en Testing
    needs: analisis-iac
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: backend-testing
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Descargar configuración del commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.analisis-iac.outputs.head_sha }}
          persist-credentials: false

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: backend-dist-reducido
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.analisis-iac.outputs.ci_run_id }}

      - name: Verificar configuración del despliegue
        shell: bash
        env:
          SHA_ESPERADO: ${{ needs.analisis-iac.outputs.head_sha }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for nombre in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_BACKEND_APP_NAME AZURE_BACKEND_URL; do
            if [[ -z "${!nombre}" ]]; then
              echo "::error::Falta configurar $nombre en el entorno."
              exit 1
            fi
          done
          if [[ "$AZURE_BACKEND_URL" != https://* ]]; then
            echo "::error::La URL del backend debe usar HTTPS."
            exit 1
          fi
          test -s dist-ready/backend-reducido.zip
          if [[ "$(unzip -p dist-ready/backend-reducido.zip version.txt)" != "$SHA_ESPERADO" ]]; then
            echo "::error::El ZIP no corresponde al SHA aprobado. Genera un artefacto nuevo con el CI actualizado."
            exit 1
          fi

      - name: Iniciar sesión en Azure con OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.16.4"
          terraform_wrapper: false

      - name: Inicializar Terraform
        working-directory: ${{ needs.analisis-iac.outputs.directorio_terraform }}
        run: terraform init -input=false

      - name: Planificar infraestructura de Testing
        working-directory: ${{ needs.analisis-iac.outputs.directorio_terraform }}
        run: |
          resources=$(terraform state list)
          grep -Fxq 'azurerm_service_plan.backend_testing' <<< "$resources"
          grep -Fxq 'azurerm_linux_web_app.backend_testing' <<< "$resources"
          terraform plan -input=false -out=tfplan

      - name: Aplicar infraestructura de Testing
        working-directory: ${{ needs.analisis-iac.outputs.directorio_terraform }}
        run: |
          set -o pipefail
          terraform show -json tfplan | jq -e '
            all(.resource_changes[]? | select(.mode == "managed");
              ((.change.actions | index("delete")) == null) and (
              (.address == "azurerm_service_plan.backend_testing" and
               .change.after.name == "service-zg-test" and .change.after.resource_group_name == "zg-erp") or
              (.address == "azurerm_linux_web_app.backend_testing" and
               .change.after.name == "zgerpbacktest" and .change.after.resource_group_name == "zg-erp")
              ))
          ' > /dev/null
          terraform apply -input=false tfplan

      - name: Desplegar App Service de Testing
        shell: bash
        env:
          AZURE_CORE_OUTPUT: none
        run: >-
          az webapp deploy
          --resource-group "$AZURE_RESOURCE_GROUP"
          --name "$AZURE_BACKEND_APP_NAME"
          --src-path dist-ready/backend-reducido.zip
          --type zip
          --clean true
          --restart true
          --track-status false
          --timeout 600000
          --only-show-errors

      - name: Verificar disponibilidad de Testing
        shell: bash
        env:
          URL_DESPLIEGUE: ${{ env.AZURE_BACKEND_URL }}
          SHA_ESPERADO: ${{ needs.analisis-iac.outputs.head_sha }}
        run: bash .github/scripts/verificar-despliegue.sh backend "$URL_DESPLIEGUE" "$SHA_ESPERADO"
