name: Integración continua del frontend DevOps

on:
  push:
    branches:
      - "test/e**"
    paths:
      - ".github/scripts/verificar-despliegue.sh"
      - "frontend/**"
      - "infra/environments/testing/frontend/**"
      - ".github/workflows/frontend-ci-devops.yml"
      - ".github/workflows/frontend-cd-devops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    if: startsWith(github.ref, 'refs/heads/test/e')
    name: Pruebas y cobertura del frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit

      - name: Ejecutar pruebas unitarias y registrar cobertura
        run: npm run test:ci

      - name: Verificar reporte de cobertura
        run: test -s coverage/erp-frontend/lcov.info

      - name: Analizar código con SonarCloud
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: frontend
          args: >-
            -Dsonar.organization=claudioignav
            -Dsonar.projectKey=claudioignav_erp-frontend
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions=**/*.spec.ts
            -Dsonar.exclusions=**/*.spec.ts
            -Dsonar.javascript.lcov.reportPaths=coverage/erp-frontend/lcov.info
            -Dsonar.qualitygate.wait=false

      - name: Conservar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-cobertura-reducida
          path: frontend/coverage/erp-frontend/
          if-no-files-found: warn
          retention-days: 7

  compilacion:
    name: Compilación del frontend
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit

      - name: Compilar artefacto de producción
        run: npm run build:production

      - name: Identificar versión del artefacto
        shell: bash
        run: |
          archivo=dist/erp-frontend/browser/index.html
          sed -i "s|</head>|<meta name=\"version-despliegue\" content=\"$GITHUB_SHA\"></head>|" "$archivo"
          grep -Fq "<meta name=\"version-despliegue\" content=\"$GITHUB_SHA\">" "$archivo"

      - name: Publicar artefacto del CI DevOps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-dist-reducido
          path: frontend/dist/erp-frontend/browser/
          if-no-files-found: error
          retention-days: 7
