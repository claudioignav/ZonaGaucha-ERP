name: Frontend CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Integración continua
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Escaneo de secretos (GitGuardian)
        uses: GitGuardian/ggshield-action@v1
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_AFTER_SHA: ${{ github.event.after }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      # --- ANALISIS SCA (DEPENDENCIAS) ---
      - name: Analisis SCA de dependencias (Snyk)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      # --- ANALISIS SAST (CODIGO ESTATICO) ---
      - name: Analisis SAST (SonarQube Cloud)
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=claudioignav
            -Dsonar.projectKey=claudioignav_erp-frontend
            -Dsonar.sources=src

      # --- COMPILACION Y EMPAQUETADO ---
      - name: Compilar Angular (Produccion)
        run: npm run build -- --configuration production

      - name: Subir artefacto compilado
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/erp-frontend/browser/
          retention-days: 1
