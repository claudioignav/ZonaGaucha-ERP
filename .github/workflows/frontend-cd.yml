name: Despliegue continuo del frontend

on:
  workflow_run:
    workflows: [Integración continua del frontend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de una ejecución exitosa del CI del frontend
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

jobs:
  artifact-security:
    name: Verificar infraestructura antes del despliegue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar configuración Terraform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Analizar Terraform con Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  deploy-staging:
    name: Desplegar frontend en staging
    needs: artifact-security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: frontend-staging

    steps:
      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Sincronizar Storage de staging
        shell: bash
        env:
          AZURE_FRONTEND_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_FRONTEND_STORAGE_CONNECTION_STRING }}
        run: >-
          az storage blob sync
          --connection-string "$AZURE_FRONTEND_STORAGE_CONNECTION_STRING"
          --container '$web'
          --source dist-ready
          --delete-destination true

      - name: Verificar disponibilidad de staging
        env:
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "$AZURE_FRONTEND_URL"

  dast:
    name: DAST del frontend en staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: frontend-staging
    continue-on-error: true

    steps:
      - name: Ejecutar OWASP ZAP Baseline
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874 # v0.15.0
        with:
          target: ${{ vars.AZURE_FRONTEND_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: frontend-zap-${{ github.run_id }}
          cmd_options: -a

  deploy-production:
    name: Desplegar frontend en producción
    needs: [deploy-staging, dast]
    if: ${{ always() && needs.deploy-staging.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: frontend-production

    steps:
      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || inputs.ci_run_id }}

      - name: Sincronizar Storage de producción
        shell: bash
        env:
          AZURE_FRONTEND_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_FRONTEND_STORAGE_CONNECTION_STRING }}
        run: >-
          az storage blob sync
          --connection-string "$AZURE_FRONTEND_STORAGE_CONNECTION_STRING"
          --container '$web'
          --source dist-ready
          --delete-destination true

      - name: Verificar disponibilidad de producción
        env:
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "$AZURE_FRONTEND_URL"
