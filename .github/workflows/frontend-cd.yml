name: Frontend CD Pipeline

on:
  workflow_run:
    workflows: ["Frontend CI Pipeline"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  cd:
    name: Deploy to Azure Storage
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Descargar artefacto compilado
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16
        with:
          name: angular-dist
          path: ./dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Escaneo de Seguridad IaC con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      - name: Desplegar archivos al contenedor web
        uses: azure/cli@v2
        with:
          inlineScript: |
            az storage blob sync \
              --connection-string "${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}" \
              --container '$web' \
              --source ./dist-ready \
              --delete-destination true

      - name: Registrar despliegue en Grafana Cloud
        uses: fjogeleit/http-request-action@v1
        with:
          url: '${{ secrets.GRAFANA_URL }}/api/annotations'
          method: 'POST'
          customHeaders: '{"Authorization": "Bearer ${{ secrets.GRAFANA_API_TOKEN }}"}'
          data: '{"text": "Despliegue ERP Frontend exitoso (Commit: ${{ github.sha }})", "tags": ["frontend", "produccion", "azure"]}'