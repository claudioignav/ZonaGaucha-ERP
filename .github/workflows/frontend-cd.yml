name: Despliegue continuo del frontend

on:
  workflow_run:
    workflows: [Integración continua del frontend]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: ID de una ejecución exitosa del CI del frontend en main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: frontend-cd-production
  cancel-in-progress: false

jobs:
  analisis-iac:
    name: Análisis de infraestructura (IaC)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      ci_run_id: ${{ steps.validar-ci.outputs.ci_run_id }}
      head_sha: ${{ steps.validar-ci.outputs.head_sha }}

    steps:
      - name: Verificar origen y resultado del CI
        id: validar-ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORIO: ${{ github.repository }}
          CI_RUN_ID: ${{ github.event.workflow_run.id || inputs.ci_run_id }}
          CD_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          if [[ "$CD_REF" != "refs/heads/main" ]]; then
            echo "::error::El CD solo puede ejecutarse desde main."
            exit 1
          fi

          if [[ ! "$CI_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::El ID del CI debe ser numérico."
            exit 1
          fi

          workflow_id=$(gh api "repos/$REPOSITORIO/actions/workflows/frontend-ci.yml" --jq '.id')
          ejecucion=$(gh api "repos/$REPOSITORIO/actions/runs/$CI_RUN_ID")

          if ! jq -e --arg repositorio "$REPOSITORIO" --argjson workflow_id "$workflow_id" '
            .workflow_id == $workflow_id and
            .repository.full_name == $repositorio and
            .head_repository.full_name == $repositorio and
            .head_branch == "main" and
            .status == "completed" and
            .conclusion == "success" and
            (.event == "push" or .event == "workflow_dispatch") and
            (.head_sha | test("^[0-9a-f]{40}$"))
          ' <<< "$ejecucion" > /dev/null; then
            echo "::error::Se requiere un CI del frontend exitoso, terminado y ejecutado en main de este repositorio."
            exit 1
          fi

          head_sha=$(jq -r '.head_sha' <<< "$ejecucion")
          printf 'ci_run_id=%s\n' "$CI_RUN_ID" >> "$GITHUB_OUTPUT"
          printf 'head_sha=%s\n' "$head_sha" >> "$GITHUB_OUTPUT"

      - name: Descargar configuración Terraform del commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ steps.validar-ci.outputs.head_sha }}
          persist-credentials: false

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.validar-ci.outputs.ci_run_id }}

      - name: Analizar Terraform con Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: config
          scan-ref: infra/frontend
          severity: CRITICAL,HIGH
          exit-code: "1"
          format: table

  despliegue-preproduccion:
    name: Despliegue del frontend en preproducción
    needs: analisis-iac
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: frontend-staging

    steps:
      - name: Descargar configuracion del commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.analisis-iac.outputs.head_sha }}
          persist-credentials: false

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.analisis-iac.outputs.ci_run_id }}

      - name: Configurar API de preproducción
        run: node frontend/scripts/configurar-entorno.cjs staging dist-ready

      - name: Sincronizar Storage de preproducción
        shell: bash
        env:
          AZURE_FRONTEND_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_FRONTEND_STORAGE_CONNECTION_STRING }}
        run: >-
          az storage blob sync
          --connection-string "$AZURE_FRONTEND_STORAGE_CONNECTION_STRING"
          --container '$web'
          --source dist-ready
          --delete-destination true

      - name: Verificar disponibilidad de preproducción
        env:
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "$AZURE_FRONTEND_URL"

  dast-preproduccion:
    name: Análisis dinámico (DAST)
    needs: despliegue-preproduccion
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: frontend-staging
    continue-on-error: true

    steps:
      - name: Ejecutar OWASP ZAP Baseline
        uses: zaproxy/action-baseline@6c5a007541891231cd9e0ddec25d4f25c59c9874
        with:
          target: ${{ vars.AZURE_FRONTEND_URL }}
          allow_issue_writing: false
          fail_action: false
          artifact_name: frontend-zap-${{ github.run_id }}
          cmd_options: -a

  despliegue-produccion:
    name: Despliegue del frontend en producción
    needs: [analisis-iac, despliegue-preproduccion, dast-preproduccion]
    if: ${{ always() && needs.analisis-iac.result == 'success' && needs.despliegue-preproduccion.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: frontend-production

    steps:
      - name: Descargar configuracion del commit aprobado
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.analisis-iac.outputs.head_sha }}
          persist-credentials: false

      - name: Descargar artefacto aprobado por CI
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: frontend-dist
          path: dist-ready
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.analisis-iac.outputs.ci_run_id }}

      - name: Configurar API de producción
        run: node frontend/scripts/configurar-entorno.cjs production dist-ready

      - name: Sincronizar Storage de producción
        shell: bash
        env:
          AZURE_FRONTEND_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_FRONTEND_STORAGE_CONNECTION_STRING }}
        run: >-
          az storage blob sync
          --connection-string "$AZURE_FRONTEND_STORAGE_CONNECTION_STRING"
          --container '$web'
          --source dist-ready
          --delete-destination true

      - name: Verificar disponibilidad de producción
        env:
          AZURE_FRONTEND_URL: ${{ vars.AZURE_FRONTEND_URL }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 10 "$AZURE_FRONTEND_URL"
