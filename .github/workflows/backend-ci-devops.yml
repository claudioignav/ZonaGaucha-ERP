name: Integración continua del backend DevOps

on:
  push:
    branches:
      - "test/e**"
    paths:
      - ".github/scripts/verificar-despliegue.sh"
      - "backend/**"
      - "infra/environments/testing/backend/**"
      - ".github/workflows/backend-ci-devops.yml"
      - ".github/workflows/backend-cd-devops.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-devops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    if: startsWith(github.ref, 'refs/heads/test/e')
    name: Pruebas y cobertura del backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit

      - name: Ejecutar pruebas y registrar cobertura sin umbral mínimo
        run: npm run test:ci -- --coverageThreshold='{}' --json --outputFile=coverage/resultados-pruebas.json

      - name: Verificar reporte de cobertura
        run: test -s coverage/lcov.info

      - name: Analizar código con SonarCloud
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.organization=claudioignav
            -Dsonar.projectKey=claudioignav_erp-backend
            -Dsonar.sources=.
            -Dsonar.tests=.
            -Dsonar.test.inclusions=**/*.spec.js,**/*.test.js,**/tests/**,**/__tests__/**
            -Dsonar.exclusions=node_modules/**,coverage/**,**/*.spec.js,**/*.test.js,**/tests/**,**/__tests__/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.qualitygate.wait=false

      - name: Conservar resultados de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-cobertura-reducida
          path: backend/coverage/
          if-no-files-found: warn
          retention-days: 7

  empaquetado:
    name: Empaquetado del backend
    needs: pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias reproducibles
        run: npm ci --no-audit

      - name: Comprobar sintaxis del backend
        shell: bash
        run: |
          set -euo pipefail
          node --check index.js
          find . \( -path ./node_modules -o -path ./coverage \) -prune -o -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Empaquetar aplicación y dependencias de producción
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backend-package-reducido"
          rsync -a \
            --exclude='node_modules/' \
            --exclude='coverage/' \
            --exclude='tests/' \
            --exclude='__tests__/' \
            --exclude='*.spec.*' \
            --exclude='*.test.*' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.git*' \
            --exclude='*.log' \
            --exclude='vitest.config.*' \
            ./ "$RUNNER_TEMP/backend-package-reducido/"
          npm ci --omit=dev --no-audit --prefix "$RUNNER_TEMP/backend-package-reducido"
          cd "$RUNNER_TEMP/backend-package-reducido"
          printf '%s\n' "$GITHUB_SHA" > version.txt
          zip -qr "$GITHUB_WORKSPACE/backend-reducido.zip" .

      - name: Publicar artefacto del CI DevOps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-dist-reducido
          path: backend-reducido.zip
          if-no-files-found: error
          retention-days: 7
