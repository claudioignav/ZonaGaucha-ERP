<h3 class="mt-6 text-sm font-semibold">Sección de Productos</h3>

<div class="mt-3 overflow-x-auto rounded-xl border border-slate-200">
  <table class="w-full min-w-[520px] text-sm">
    <thead class="bg-verde-claro text-left text-xs font-bold text-verde-oscuro uppercase">
      <tr>
        <th class="px-6 py-3.5">Nombre del Producto</th>
        <th class="w-32 px-3 py-3.5">Cantidad</th>
        <th class="w-28 px-3 py-3.5 text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (detalle of productos; track $index; let i = $index) {
        <tr class="border-slate-200" [class.border-b]="!$last" [class.bg-fondo]="filaAlterna && $odd">
          <td class="px-6 py-3">
            <select class="campo bg-white" aria-label="Seleccionar producto..." [name]="'producto-' + i" [(ngModel)]="detalle.producto">
              <option value="">Seleccionar producto...</option>
              @for (producto of opciones; track producto) {
                <option [value]="producto">{{ producto }}</option>
              }
            </select>
          </td>
          <td class="px-3 py-3">
            <input type="number" min="1" class="campo bg-white" aria-label="Cantidad" [name]="'cantidad-' + i" [(ngModel)]="detalle.cantidad" />
          </td>
          <td class="px-3 py-3 text-center">
            <button type="button" title="Quitar producto" (click)="quitarProducto(i)">
              <img class="size-7" src="assets/icons/del-btn.svg" alt="Quitar" />
            </button>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>

<button type="button" class="mt-4 flex items-center gap-2 text-sm font-semibold text-verde-boton hover:underline" (click)="agregarProducto()">
  <img class="size-4" src="assets/icons/plus.svg" alt="" />
  {{ textoBoton }}
</button>
